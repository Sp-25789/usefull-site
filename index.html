function getSb() {
if (!sb && window.supabase && typeof window.supabase.createClient === 'function') sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function toInternalEmail(username) {
const bytes = new TextEncoder().encode(username.trim());
let hex = '';
for (const byte of bytes) hex += byte.toString(16).padStart(2, '0');
return 'u_' + hex + '@user.infinitetools.local';
}
function setMessage(id, message, color) {
const el = document.getElementById(id);
if (!el) return;
el.textContent = message || '';
if (color) el.style.color = color;
}
function showPage(pageId, pushHistory = true) {
const page = document.getElementById('page-' + pageId);
if (!page) return;
if (document.querySelector('.page.active')?.id === 'page-' + pageId) {
if (pushHistory) {
const currentHash = location.hash.replace(/^#/, '');
if (currentHash !== pageId) history.pushState({ page: pageId }, '', '#' + pageId);
}
return;
}
document.querySelectorAll('.page').forEach((el) => el.classList.remove('active'));
page.classList.add('active');
if (pageId === 'tools') renderToolsTable();
if (pageId === 'rules') renderRules();
if (pageId === 'account' && currentProfile) handleHeaderUserClick();
if (pushHistory) {
const currentHash = location.hash.replace(/^#/, '');
if (currentHash !== pageId) history.pushState({ page: pageId }, '', '#' + pageId);
}
window.scrollTo({ top: 0, behavior: 'smooth' });
}
window.addEventListener('popstate', (event) => {
const statePage = event.state?.page;
const hashPage = location.hash.replace(/^#/, '');
const targetPage = statePage || hashPage || 'home';
showPage(targetPage, false);
});
function evaluateRank(profile) {
const age = Math.max(0, Math.floor((Date.now() - new Date(profile.created_at).getTime()) / 86400000));
const uses = Number(profile.tool_uses) || 0;
const accesses = Number(profile.access_count) || 0;
const streak = Number(profile.consecutive_days) || 0;
if (uses >= 150 && accesses >= 100 && streak >= 14 && age >= 90) return 'platinum';
if (uses >= 80 && accesses >= 50 && streak >= 7 && age >= 30) return 'gold';
if (uses >= 30 && accesses >= 20 && streak >= 3 && age >= 15) return 'silver';
if (uses >= 10 && accesses >= 5) return 'bronze';
return 'normal';
}
async function loadUserProfile(user, countAccess) {
const client = getSb();
if (!client || !user) return false;
currentUser = user;
let { data: profile, error } = await client.from('profiles').select('*').eq('id', user.id).maybeSingle();
if (error) throw error;
if (!profile) {
const initial = { id:user.id, username:user.user_metadata?.username || user.email || 'user', recovery_email:null, tool_uses:0, access_count:0, consecutive_days:0, last_access_date:null, rank:'normal', created_at:user.created_at || new Date().toISOString() };
const result = await client.from('profiles').insert(initial).select().single();
if (result.error) throw result.error;
profile = result.data;
}
if (countAccess) {
const today = new Date().toISOString().split('T')[0];
let accessCount = Number(profile.access_count) || 0;
let consecutive = Number(profile.consecutive_days) || 0;
if (profile.last_access_date !== today) {
const yesterday = new Date(Date.now() - 86400000).toISOString().split('T')[0];
consecutive = profile.last_access_date === yesterday ? consecutive + 1 : 1;
accessCount += 1;
}
const candidate = { ...profile, access_count:accessCount, consecutive_days:consecutive, last_access_date:today };
const rank = evaluateRank(candidate);
const result = await client.from('profiles').update({ access_count:accessCount, consecutive_days:consecutive, last_access_date:today, rank }).eq('id', user.id).select().single();
if (result.error) throw result.error;
profile = result.data;
}
currentProfile = profile;
isAccountPublic = Boolean(profile.is_public);
applyUserUI();
await loadRecommendations();
return true;
}

async function handleSignup() {
const client = getSb();
if (!client) return setMessage('signup-msg', 'Supabase SDKを読み込めませんでした。再読み込みしてください。');
const username = document.getElementById('signup-username').value.trim();
const password = document.getElementById('signup-password').value;
setMessage('signup-msg', '');
if (!username || !password) return setMessage('signup-msg', 'ユーザー名とパスワードを入力してください。');
if (password.length < 6) return setMessage('signup-msg', 'パスワードは6文字以上にしてください。');
try {
const { data, error } = await client.auth.signUp({ email:toInternalEmail(username), password, options:{ data:{ username } } });
if (error) {
const msg = (error.message || '').toLowerCase();
if (msg.includes('already registered') || msg.includes('already exists') || error.code === 'user_already_exists') {
document.getElementById('login-username').value = username;
setMessage('login-msg', '');
showPage('login');
return;
}
throw error;
}
if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
document.getElementById('login-username').value = username;
setMessage('login-msg', '');
showPage('login');
return;
}
if (data.session && data.user) {
await loadUserProfile(data.user, true);
showPage('home');
} else {
setMessage('signup-msg', '登録を受け付けました。Supabaseのメール確認設定をご確認ください。', '#2e8b57');
}
} catch (error) {
console.error(error);
setMessage('signup-msg', '登録に失敗しました: ' + (error.message || '不明なエラー'));
}
}
async function handleLogin() {
const client = getSb();
if (!client) return setMessage('login-msg', 'Supabase SDKを読み込めませんでした。再読み込みしてください。');
const username = document.getElementById('login-username').value.trim();
const password = document.getElementById('login-password').value;
setMessage('login-msg', '');
if (!username || !password) return setMessage('login-msg', 'ユーザー名とパスワードを入力してください。');
try {
const { data, error } = await client.auth.signInWithPassword({ email:toInternalEmail(username), password });
if (error) {
loginFailCount += 1;
setMessage('login-msg', 'ログイン失敗 (' + loginFailCount + '回目)');
if (loginFailCount >= 3) document.getElementById('forgot-link-area').style.display = 'block';
return;
}
loginFailCount = 0;
document.getElementById('forgot-link-area').style.display = 'none';
if (data.user) { await loadUserProfile(data.user, true); showPage('home'); }
} catch (error) {
console.error(error);
setMessage('login-msg', 'ログイン後のプロフィール読み込みに失敗しました。データベース設定をご確認ください。');
}
}

async function sendRecoveryOtp() {
const client = getSb();
if (!client) return setMessage('forgot-msg', 'Supabase SDKを読み込めませんでした。');
const username = document.getElementById('forgot-username').value.trim();
const email = document.getElementById('forgot-email').value.trim();
const msg = document.getElementById('forgot-msg');
msg.style.color = '#d9534f';
setMessage('forgot-msg', '');
if (!username || !email) return setMessage('forgot-msg', 'ユーザー名とメールアドレスを入力してください。');
try {
const { data: matches, error: rpcError } = await client.rpc('verify_user_email', { p_username:username, p_email:email });
if (rpcError) throw rpcError;
if (!matches) return setMessage('forgot-msg', 'ユーザー名またはメールアドレスが一致しません。');
const { error } = await client.auth.signInWithOtp({ email, options:{ shouldCreateUser:false } });
if (error) throw error;
recoveryEmailCache = email;
recoveryUsernameCache = username;
document.getElementById('forgot-step-1').style.display = 'none';
document.getElementById('forgot-step-2').style.display = 'block';
setMessage('forgot-msg', 'メールに認証コードを送信しました。', '#2e8b57');
} catch (error) {
console.error(error);
setMessage('forgot-msg', '認証コードを送信できませんでした。復旧用メール設定をご確認ください。');
}
}
async function verifyRecoveryOtp() {
const client = getSb();
if (!client) return setMessage('forgot-msg', 'Supabase SDKを読み込めませんでした。');
const token = document.getElementById('forgot-otp').value.trim();
if (!/^\d{6}$/.test(token)) return setMessage('forgot-msg', '6桁の数字を入力してください。');
try {
const { data, error } = await client.auth.verifyOtp({ email:recoveryEmailCache, token, type:'email' });
if (error) throw error;
if (!data.user) throw new Error('認証ユーザーが返されませんでした');
await loadUserProfile(data.user, true);
loginFailCount = 0;
showPage('home');
} catch (error) {
console.error(error);
setMessage('forgot-msg', '認証コードの確認に失敗しました。コードを確認して再試行してください。');
}
}

function validateAccountSettings() {
const nameVal = document.getElementById('acc-name-input').value.trim();
const passVal = document.getElementById('acc-pass-input').value;
const emailVal = document.getElementById('acc-email-input').value.trim();
const nameOk = nameVal.length >= 1 && nameVal.length <= 40;
const passOk = passVal === '' || passVal.length >= 6;
const emailOk = emailVal === '' || /^[^\s@]+@[^\s@]+.[^\s@]+$/.test(emailVal);
setStatusIndicator('status-name', nameOk);
setStatusIndicator('status-pass', passOk);
setStatusIndicator('status-email', emailOk);
return nameOk && passOk && emailOk;
}
async function saveAccountSettings() {
const client = getSb();
if (!client || !currentUser || !currentProfile) return;
if (!validateAccountSettings()) {
return setMessage('setting-msg', 'NGの項目を修正してください。', '#d9534f');
}
const newUsername = document.getElementById('acc-name-input').value.trim();
const newPassword = document.getElementById('acc-pass-input').value;
const newEmail = document.getElementById('acc-email-input').value.trim();
try {
const authUpdates = {};
if (newUsername && newUsername !== currentProfile.username) {
authUpdates.email = toInternalEmail(newUsername);
authUpdates.data = { username: newUsername };
}
if (newPassword) {
authUpdates.password = newPassword;
}
if (Object.keys(authUpdates).length > 0) {
const { error: authError } = await client.auth.updateUser(authUpdates);
if (authError) throw authError;
}
const { data, error } = await client
.from('profiles')
.update({ username: newUsername, recovery_email: newEmail || null })
.eq('id', currentUser.id)
.select()
.single();
if (error) throw error;
currentProfile = data;
document.getElementById('acc-pass-input').value = '';
validateAccountSettings();
applyUserUI();
setMessage('setting-msg', '保存しました。', '#2e8b57');
} catch (error) {
console.error(error);

async function recordToolUse(toolId) {
const client = getSb();
if (!client || !currentUser || !currentProfile) return;
const before = currentProfile;
const newUses = (Number(before.tool_uses) || 0) + 1;
const rank = evaluateRank({ ...before, tool_uses:newUses });
try {
const { data: history, error: historyReadError } = await client.from('tool_history').select('id,use_count').eq('user_id', currentUser.id).eq('tool_id', toolId).maybeSingle();
if (historyReadError) throw historyReadError;
let historyResult;
if (history) historyResult = await client.from('tool_history').update({ use_count:(Number(history.use_count)||0)+1, updated_at:new Date().toISOString() }).eq('id', history.id);
else historyResult = await client.from('tool_history').insert({ user_id:currentUser.id, tool_id:toolId, use_count:1 });
if (historyResult.error) throw historyResult.error;
const { data: updated, error: profileError } = await client.from('profiles').update({ tool_uses:newUses, rank }).eq('id', currentUser.id).select().single();
if (profileError) throw profileError;
currentProfile = updated;
applyUserUI();
await loadRecommendations();
} catch (error) {
console.error(error);
try {
const { data, error: refreshError } = await client.from('profiles').select('*').eq('id', currentUser.id).single();
if (!refreshError && data) { currentProfile = data; applyUserUI(); }
await loadRecommendations();
} catch (refreshError) { console.error(refreshError); }
const notice = document.getElementById('tool-notice');
if (notice) notice.textContent = '利用履歴を保存できませんでした。';
}
}
async function loadRecommendations() {
const client = getSb();
if (!client || !currentUser) return;
const emptyBox = document.getElementById('rec-empty-box');
const listBox = document.getElementById('rec-list-box');
const { data: history, error } = await client.from('tool_history').select('tool_id,use_count').eq('user_id', currentUser.id).order('use_count', { ascending:false }).limit(3);
if (error) { console.error(error); emptyBox.style.display='block'; listBox.style.display='none'; return; }
const valid = (history || []).map((row) => toolsData.find((tool) => tool.id === row.tool_id)).filter(Boolean);
if (!valid.length) { emptyBox.style.display='block'; listBox.style.display='none'; return; }
emptyBox.style.display='none';
listBox.style.display='flex';
listBox.replaceChildren();
valid.forEach((tool) => {
const button = document.createElement('button');
button.type = 'button'; button.className = 'rec-item-btn'; button.textContent = tool[currentLang].replace(/\n/g, ' ');
button.addEventListener('click', () => openTool(tool.id));
listBox.appendChild(button);
});
}
function openTool(toolId) {
const tool = toolsData.find((item) => item.id === toolId);
if (!tool) return;
if ((rankOrder[currentRank] ?? 0) < rankOrder[tool.req]) return;
const notice = document.getElementById('tool-notice');
if (notice) notice.textContent = '';
recordToolUse(toolId);
if (tool.page) showPage(tool.page);
else if (tool.url && tool.url !== '#') window.location.href = tool.url;
else if (notice) notice.textContent = i18n[currentLang].unsupported;
}
function renderToolsTable() {
const tbody = document.getElementById('tool-table-body');
if (!tbody) return;
tbody.replaceChildren();
const userLevel = rankOrder[currentRank] ?? 0;
toolsData.forEach((tool) => {
const row = document.createElement('tr');
const name = document.createElement('td');
name.textContent = tool[currentLang];
const access = document.createElement('td');
if (userLevel >= rankOrder[tool.req]) {
const button = document.createElement('button');
button.type = 'button'; button.className = 'tool-action'; button.textContent = tool.page ? reqLabels[currentLang].open : 'URL';
button.addEventListener('click', () => openTool(tool.id));
access.appendChild(button);
} else {
const span = document.createElement('span'); span.className='tool-locked';
span.textContent = currentRank === 'guest' ? reqLabels[currentLang].unavailable : reqLabels[currentLang][tool.req];
access.appendChild(span);
}
row.append(name, access); tbody.appendChild(row);
});
}

function formatTime(ms) {
const totalSec = Math.floor(ms / 1000);
const min = Math.floor(totalSec / 60);
const sec = String(totalSec % 60).padStart(2, '0');
const centi = String(Math.floor((ms % 1000) / 10)).padStart(2, '0');
return min + ':' + sec + '.' + centi;
}
function startTimer(id) {
const timer = timers[id];
if (timer.running) return;
timer.running = true;
timer.startTime = Date.now() - timer.elapsed;
timer.interval = window.setInterval(() => {
timer.elapsed = Date.now() - timer.startTime;
document.getElementById('sw' + id + '-time-display').textContent = formatTime(timer.elapsed);
}, 10);
updateSwButtonsUI(id);
}
function stopTimer(id) {
const timer = timers[id];
if (!timer.running) return;
timer.elapsed = Date.now() - timer.startTime;
timer.running = false;
window.clearInterval(timer.interval);
timer.interval = null;
document.getElementById('sw' + id + '-time-display').textContent = formatTime(timer.elapsed);
updateSwButtonsUI(id);
}
function handleSwRight(id) {
const timer = timers[id];
if (timer.running) { stopTimer(id); return; }
if (document.getElementById('chess-toggle').checked) stopTimer(id === 1 ? 2 : 1);
startTimer(id);
}
function handleSwLeft(id) {
const timer = timers[id];
if (timer.running) { laps.unshift(formatTime(Date.now() - timer.startTime)); renderLaps(); return; }
timer.elapsed = 0;
document.getElementById('sw' + id + '-time-display').textContent = '0:00.00';
if (id === 1) { laps = []; renderLaps(); }
}
function updateSwButtonsUI(id) {
const timer = timers[id];
const left = document.getElementById('sw' + id + '-left-btn');
const right = document.getElementById('sw' + id + '-right-btn');
if (!left || !right) return;
left.textContent = timer.running ? i18n[currentLang].swLap : i18n[currentLang].swReset;
right.textContent = timer.running ? i18n[currentLang].swStop : i18n[currentLang].swStart;
right.className = 'sw-circle-btn ' + (timer.running ? 'btn-red' : 'btn-green');
}
